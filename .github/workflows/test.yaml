name: Test
on:
  workflow_run:
    workflows:
      - Build & Push Image
    types:
      - completed
jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - run: docker run -v ./test/:/root/ws/test/ shynur/ide bash ~/ws/test/main.bash
