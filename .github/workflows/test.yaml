name: Test
on:
  workflow_run:
    workflows:
      - Build & Push Image
    types:
      - completed
jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: docker run -v ./test/:/root/ws/test/ shynur/ide bash '~/ws/test/main.bash'
