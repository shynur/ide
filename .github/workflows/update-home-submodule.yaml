name: Update HOME submodule

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Update HOME submodule
        run: |
          git submodule update --init --remote -- HOME

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- HOME; then
            echo "HOME submodule is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HOME
          git commit -m "chore: update HOME submodule"
          git push origin "HEAD:${{ github.ref_name }}"
