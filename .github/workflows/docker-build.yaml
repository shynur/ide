name: Build & Push Image
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
jobs:
  update-home:
    permissions:
      contents: write
    uses: ./.github/workflows/update-submodule-home.yaml
    secrets: inherit
  build:
    needs: update-home
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-cnb:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to docker.cnb.cool
          uses: docker/login-action@v3
          with:
            registry: docker.cnb.cool
            username: cnb
            password: ${{ secrets.CNBCOOL_TOKEN }}
        - name: Copy to docker.cnb.cool
          run: |
            SHYNUR_IDE_IMAGE=${{ github.repository_owner }}/${{ github.event.repository.name }}
            docker buildx imagetools create -t docker.cnb.cool/$SHYNUR_IDE_IMAGE:x64   $SHYNUR_IDE_IMAGE:x64
            docker buildx imagetools create -t docker.cnb.cool/$SHYNUR_IDE_IMAGE:arm64 $SHYNUR_IDE_IMAGE:arm64
  merge:
    needs: 
      - build
      - build-cnb
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to docker.cnb.cool
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNBCOOL_TOKEN }}
      - name: Create and Push Multi-arch Manifest
        run: |
          SHYNUR_IDE_IMAGE=${{ github.repository_owner }}/${{ github.event.repository.name }}
          docker buildx imagetools create -t                 $SHYNUR_IDE_IMAGE                 $SHYNUR_IDE_IMAGE:x64                 $SHYNUR_IDE_IMAGE:arm64
          docker buildx imagetools create -t docker.cnb.cool/$SHYNUR_IDE_IMAGE docker.cnb.cool/$SHYNUR_IDE_IMAGE:x64 docker.cnb.cool/$SHYNUR_IDE_IMAGE:arm64
