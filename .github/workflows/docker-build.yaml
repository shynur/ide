name: Build & Push Image
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
jobs:
  build:
    runs-on: ubuntu-latest
    # Minimum GITHUB_TOKEN permissions required for checkout and artifact upload.
    permissions:
      contents: read
    # One job per ISA; each pushes its platform image by digest.
    strategy:
      matrix:
        isa: ["amd64", "arm64"]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          depth: 1
      # Required for emulating non-native architectures on the runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build the image for this ISA and push it to Docker Hub by digest
      # (no tag yet; the merge job will create the final manifest list).
      - name: Build & Push Image by Digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.isa }}
          outputs: type=image,name=${{ github.repository_owner }}/${{ github.event.repository.name }},push-by-digest=true,name-canonical=true,push=true
      # Store the digest as an empty file named after it so it can be
      # collected by the merge job via artifact upload.
      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.isa }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-latest
    needs: build
    # No GITHUB_TOKEN permissions needed; only external registry tokens are used.
    permissions: {}
    steps:
      # Collect all per-ISA digests into a single directory.
      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to docker.cnb.cool
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNBCOOL_TOKEN }}
      # Combine all per-platform digests into a single multi-arch manifest
      # list and push it to both registries under the repository's name.
      - name: Create Manifest List and Push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ github.repository_owner }}/${{ github.event.repository.name }} \
            -t docker.cnb.cool/${{ github.repository_owner }}/${{ github.event.repository.name }} \
            $(printf '${{ github.repository_owner }}/${{ github.event.repository.name }}@sha256:%s ' *)
